name: Build APK

on:
  push:
    branches:
      - main
      - claude/flashcard-english-vocab-app-yh1tzi
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run core module tests
        run: ./gradlew :core:test --no-daemon

      - name: Build CLI import tool
        run: ./gradlew :cli:build --no-daemon

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon -PappVersionCode=${{ github.run_number }}

      - name: Stage APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk engvocab-debug.apk
          echo "${{ github.run_number }}" > engvocab-version.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: engvocab-debug-apk
          path: engvocab-debug.apk

      - name: Remove stale assets from previous builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest --repo "${{ github.repository }}" --json assets \
            --jq '.assets[].name' > /tmp/existing-assets.txt 2>/dev/null || true
          if [ -s /tmp/existing-assets.txt ]; then
            while read -r asset; do
              gh release delete-asset latest "$asset" -y --repo "${{ github.repository }}" || true
            done < /tmp/existing-assets.txt
          fi

      - name: Publish/refresh downloadable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "EngVocab - latest build"
          body: |
            APK automatically built from the latest commit on `${{ github.ref_name }}` (${{ github.sha }}).

            To install on your phone: download `engvocab-debug.apk` below, open it on your phone,
            and confirm the install (the first time, Android will ask you to allow installs from
            whichever app you used to download it).

            The app itself can also check for and install this release automatically - see
            Settings > Updates.
          files: |
            engvocab-debug.apk
            engvocab-version.txt
          prerelease: true
          make_latest: true
